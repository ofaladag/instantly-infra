# Managed in Coolify's Redis configuration. Host publishes only 10.20.0.30:6379.
# DATA firewall admits the staging private network 10.20.0.0/16.
bind 0.0.0.0
protected-mode no
requirepass ""
dir /data
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000
maxmemory 512mb
maxmemory-policy noeviction
